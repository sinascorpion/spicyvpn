<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>SpicyVPN</title><link rel="stylesheet" href="style.css"></head>
<body><header><button id="menu" class="icon" title="Menu" aria-label="Menu"><i data-lucide="menu"></i></button><img src="../assets/logo.png" alt=""><h1>SpicyVPN</h1><span class="preview">Desktop Preview</span><div class="header-actions"><button id="advanced" class="icon" title="Advanced settings">S</button><button id="theme" class="icon" title="Change theme"><i data-lucide="sun"></i></button><button id="more" class="icon" title="Configuration actions"><i data-lucide="ellipsis-vertical"></i></button></div></header>
<div class="shell"><aside id="sidebar"><nav><button data-view="subscriptions"><i data-lucide="refresh-cw"></i>Subscriptions</button><button data-view="routing"><i data-lucide="globe"></i>Country Routing</button><button data-view="processes"><i data-lucide="split"></i>Split Tunneling</button><button data-view="dns"><i data-lucide="shield-check"></i>DNS Settings</button><button data-view="logs"><i data-lucide="scroll-text"></i>Logs</button><button data-view="about"><i data-lucide="info"></i>About</button></nav><div class="sidebar-bottom"><span id="version">Desktop</span><button id="google-play">Google Play<i data-lucide="external-link"></i></button></div></aside>
<main><div class="tabs" role="tablist"><button role="tab" data-tab="auto" class="active">Auto Connect</button><button role="tab" data-tab="manual">Manual Selection</button><button role="tab" data-tab="custom">Custom</button></div>
<div class="connection-mode"><div class="segmented" aria-label="Connection mode"><button data-mode="proxy" class="active"><i data-lucide="network"></i>Proxy</button><button data-mode="tun"><i data-lucide="shield"></i>System Tunnel</button></div><label><input type="checkbox" id="system-proxy" checked>System proxy</label></div>
<section id="auto" class="view"><button id="auto-connect" class="connect-logo"><img src="../assets/logo.png" alt="Connect"></button><h2 id="connect-label">Connect</h2><p id="status">Disconnected</p></section>
<section id="list-view" class="view" hidden><div class="toolbar"><button id="add" class="primary"><i data-lucide="plus"></i>Add Configuration</button><button id="get-config"><i data-lucide="download"></i>Get Config</button><button id="new-folder" class="icon" title="New folder"><i data-lucide="folder-plus"></i></button><input id="search" placeholder="Search configurations" aria-label="Search configurations"><button id="test" title="Test configurations"><i data-lucide="activity"></i>Test</button><button id="sort" class="icon" title="Sort by latency"><i data-lucide="arrow-down-wide-narrow"></i></button></div><div id="profiles" class="profiles"></div><div id="empty" class="empty" hidden>No configurations</div><button id="list-connect" class="floating-connect" title="Connect selected profile"><img src="../assets/logo.png" alt="Connect"></button></section>
<div id="telemetry" hidden><div class="speed-grid"><div><span><i data-lucide="arrow-down"></i>Download</span><strong id="download">0 B/s</strong></div><div><span><i data-lucide="arrow-up"></i>Upload</span><strong id="upload">0 B/s</strong></div></div><div class="exit"><strong id="exit-ip"></strong><span id="exit-country"></span><span id="ping"></span></div></div>
<footer><span id="engine-status">Disconnected</span><span id="proxy-port"></span></footer></main></div>
<dialog id="editor"><form id="editor-form"><h2 id="editor-title">Add Configuration</h2><label>Name<input id="profile-name" maxlength="100" autocomplete="off"></label><label>Configuration<textarea id="profile-text" rows="10" spellcheck="false" required></textarea></label><div class="editor-tools"><button type="button" id="paste"><i data-lucide="clipboard-paste"></i>Clipboard</button><button type="button" id="import-file"><i data-lucide="file-up"></i>File</button></div><div class="dialog-actions"><button type="button" data-close>Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog>
<dialog id="panel"><h2 id="panel-title"></h2><div id="panel-content"></div><div class="dialog-actions"><button data-close>Close</button></div></dialog>
<div id="toast" role="status" hidden></div><script src="../node_modules/lucide/dist/umd/lucide.js"></script><script src="../node_modules/sortablejs/Sortable.min.js"></script><script src="app.js"></script></body></html>
